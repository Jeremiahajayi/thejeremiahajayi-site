<!doctype html>
<!--
  What I'd Do Live: event promotion template.
  Formats: live.html#portrait (1080x1350, LinkedIn) and live.html#wide (1600x900, X).
  For a new event, edit the .topic, .who and .when text and swap guest-full.jpg.
  Render: node render-live.js
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
:root{--cream:#FFF5D9;--ink:#111;--orange:#FF5A2A;--teal:#0E2A2E;--mint:#8FE3B0;--muted:#9DB8B0;--paper:#EAF6F1}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}

.mast{position:absolute;display:flex;align-items:baseline;gap:var(--mast-gap)}
.wm{margin:0;font:700 var(--wm)/.86 'Space Grotesk';letter-spacing:-.07em;white-space:nowrap}
.wm .i{display:inline-block;color:var(--orange);transform:translateY(-.05em) rotate(-5deg)}
.wm .dot{color:var(--orange)}
.live{font:700 var(--live)/1 'Space Grotesk';letter-spacing:-.04em;color:var(--orange)}

.sheet{position:absolute;background:var(--teal);color:var(--paper)}
.photo{position:absolute;border-radius:50%;overflow:hidden;background:#2a7480}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 38%}

.topic{margin:0;font:700 var(--topic)/1.02 'Space Grotesk';letter-spacing:-.045em;text-wrap:balance;color:var(--ink)}
.who{margin:var(--who-gap) 0 0;font:500 var(--who)/1.3 'DM Sans';color:var(--muted)}
.who b{display:block;font:700 var(--name)/1.1 'Space Grotesk';letter-spacing:-.03em;color:var(--paper)}
.when{margin:var(--when-gap) 0 0;font:500 var(--when)/1.3 'DM Sans';color:var(--muted)}
.when b{font-weight:700;color:var(--mint)}
.url{position:absolute;font:500 var(--url)/1 'DM Sans';color:var(--muted)}

/* ---------- Portrait 1080 x 1350 ---------- */
body.portrait{width:1080px;height:1350px;
  --wm:112px;--live:112px;--mast-gap:26px;
  --topic:74px;--who-gap:44px;--who:28px;--name:44px;--when-gap:30px;--when:29px;--url:22px}
.portrait .mast{left:72px;top:92px}
.portrait .sheet{left:0;right:0;bottom:0;height:780px;border-radius:48px 48px 0 0}
.portrait .photo{right:72px;top:76px;width:440px;height:440px}
.portrait .topic{position:absolute;left:72px;top:262px;width:880px}
.portrait .url{left:72px;bottom:56px}
.portrait .who{position:absolute;left:72px;top:250px;margin:0;width:440px}
.portrait .when{position:absolute;left:72px;top:366px;margin:0;width:440px}

/* ---------- Wide 1600 x 900 ---------- */
body.wide{width:1600px;height:900px;
  --wm:104px;--live:104px;--mast-gap:22px;
  --topic:72px;--who-gap:0;--who:26px;--name:40px;--when-gap:26px;--when:28px;--url:22px}
.wide .mast{left:88px;top:96px}
.wide .topic{position:absolute;left:88px;top:310px;width:780px;color:var(--ink)}
.wide .url{left:88px;bottom:64px;color:#6B675F}
.wide .sheet{top:0;bottom:0;right:0;width:600px;border-radius:48px 0 0 48px;padding:0 72px;display:flex;flex-direction:column;justify-content:center}
.wide .photo{position:relative;width:300px;height:300px;margin-bottom:40px}
.wide .when{margin-top:22px}
</style></head>
<body>
<div class="mast"><p class="wm">What <span class="i">I</span>’d Do<span class="dot">.</span></p><span class="live">Live</span></div>

<div class="sheet">
  <div class="photo"><img src="guest-full.jpg" alt="John Iwuozor"></div>
  <p class="who"><b>John Iwuozor</b>Content Lead at DualEntry</p>
  <p class="when"><b>December 8</b> · 7 PM WAT · Online</p>
  <div class="body"><p class="topic">Your first 90 days as content lead: where do you start?</p></div>
</div>

<div class="url">thejeremiahajayi.com/what-id-do</div>

<script>
const wide = location.hash === '#wide';
document.body.className = wide ? 'wide' : 'portrait';
// The topic sits on the cream side in both formats; guest details stay in the panel.
document.body.appendChild(document.querySelector('.topic')); document.querySelector('.body').remove();
</script>
</body></html>
